# Local development monitoring stack config (see docker/docker-compose.yml).
#
# Reads the Slack webhook URL from a file, not from this tracked config file.
# Before starting docker-compose: create monitoring/prometheus/secrets/slack_url
# locally (gitignored) containing just the webhook URL. If you don't use Slack,
# leave it empty — Alertmanager will still run and you can view firing alerts
# at http://localhost:9093.
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_url

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-warnings
  routes:
    - match:
        severity: critical
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-warnings
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}⚠️{{ else }}✅{{ end }} {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  # If the critical version of an alert is already firing, don't also spam
  # the channel with the warning-level version of the same alert.
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
