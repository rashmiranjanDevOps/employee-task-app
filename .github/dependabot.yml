version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keeps the actions pinned in .github/workflows/ci-cd.yml (checkout,
  # setup-node, trivy-action, ...) updated too — a workflow file is a
  # dependency like any other.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
