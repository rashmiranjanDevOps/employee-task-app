apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "employee-task.labels" . | nindent 4 }}

---
# Kubernetes RBAC — not IAM. This ServiceAccount can read exactly two
# objects (its own ConfigMap and Secret) and nothing else in the namespace:
# it can't list pods, read other apps' secrets, or modify anything. The app
# doesn't currently call the Kubernetes API at all, so today this Role grants
# nothing the app actually uses — it exists so that if a future feature
# needs to read its own config at runtime (e.g. a "reload config" endpoint),
# the ServiceAccount is already scoped correctly rather than reaching for
# cluster-admin out of convenience.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-backend-read-own-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "employee-task.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    resourceNames:
      - {{ .Release.Name }}-config
      - {{ .Values.existingSecretName }}
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-backend-read-own-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "employee-task.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-backend
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-backend-read-own-config
  apiGroup: rbac.authorization.k8s.io
